# Problem definitions for the varseq SEQ-DESIGN environment.
#
# DeepSTARR oracle variant. The gold branch (gold/seq-design-ds) holds the reference implementation of
# `varseq.design_task.design`; problem/seq-design-ds hollows it to NotImplementedError.
#   solution.patch = diff(problem/seq-design-ds .. gold/seq-design-ds -- workspace)
#
# DISCLOSURE RULE (prompt is the sole disclosure; skeleton is bare):
#   * CONVENTIONS stated — the design() signature + arg meanings, the metered-oracle callable
#     contract, the SESSION query allowance and the fact that it is measured outside the agent's
#     process (a rule that is enforced must be stated), the output contract the catastrophic gates
#     enforce (length / count / alphabet / determinism / raise-on-invalid), and that grading is on a
#     HELD-OUT model (design.md §4.6: anti-overfitting is the task, not a hidden gotcha).
#   * METHOD withheld — rc / shift averaging, natural-start seeding, ensembles, trust-region search,
#     restart allocation. The prompt names the goal; the agent chooses and composes the approach.
#   * NEVER mentioned — evaluator arch/count, z-norm, the natural-peak set, the reference method,
#     SATURATION, that regimes/weights exist, and how the session meter is protected (daemon,
#     socket, root-owned counter): the allowance is disclosed, its enforcement mechanism is not.

- id: seq-design
  default: true
  solutionRef: gold/seq-design-ds
  minReplayScore: 0.61  # measured oracle replay 0.7157 (grelu-v2 re-anchor, box7 2026-08-19) minus a 0.105 margin
  prompt: |
    # Design regulatory DNA with varseq

    `workspace/` is **varseq**, a library for training and interpreting sequence-to-function models of
    gene regulation. You are given a trained model that maps a DNA sequence to enhancer activity for two
    promoter contexts, developmental and housekeeping, and asked to design sequences that drive a chosen
    activity as high as possible.

    Implement `varseq.design_task.design`. How you search the sequence space is up to you. The expected
    interface is as follows:

    ```python
    def design(oracle, track, budget, length, n_designs, seed) -> list[str]:
        ...
    ```

    - `oracle` is a callable, your only access to the model: `oracle(seqs) -> array (len(seqs), n_tracks)`.
      It is metered (every sequence you score counts against `budget`, and you may call it however you
      like until then).
    - `track` is the output head to drive up. `budget` is the maximum number of sequences you may score
      through `oracle`, total. `length` is the exact length of every sequence you return. `n_designs` is
      how many to return. `seed` seeds your randomness.

    There is no internet access, but a venv with the dependencies you need is already set up in the
    workspace. `varseq.oracle.load_oracle()` connects you to the same scoring service that backs the
    oracle handed to `design()` at evaluation time, so you can develop against it directly. Metering is
    not on the honour system: the service counts every sequence it is asked to score, and the count is
    kept outside your process — development queries included. **You have 200,000 scored sequences for
    the whole session**; the object `load_oracle()` returns reports `.used`, `.budget` and `.remaining`.
    That total is measured and enforced when your `design()` is graded, so spend development queries
    deliberately. A set of real regulatory sequences is available via
    `varseq.oracle.load_seed_sequences()`.

    Your designs will be scored on a different, held-out model you cannot query. A sequence that merely
    maxes out the oracle by exploiting its quirks won't transfer, so aim for designs whose regulatory
    signal is real and holds up under a model that never saw your search. `design()` must work for
    whatever track, budget, and starting condition it is given.

    ## Contracts

    - Deterministic given the arguments and seed.
    - Return exactly `n_designs` sequences, each exactly `length` long, over the `A/C/G/T` alphabet.
    - Stay within `budget` oracle scores.
    - **Invalid arguments raise `ValueError`** (nonpositive budget/length/n_designs, a budget too small
      to score every design at least once, an invalid track or length).

    Everything runs on CPU.
