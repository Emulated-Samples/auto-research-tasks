version = "1.0"

[metadata]
source = "emulated"
environment = "grelu-test"
branch = "problem/seq-design-ds"
problem_id = "seq-design"
difficulty = "unknown"
tags = [ "emulated" ]
min_replay_score = 0.61

[agent]
timeout_sec = 86400
user = "agent"
# Egress control added 2026-08-09 (leakage remediation, EGRESS-SWEEP.md).
# Without an explicit agent-phase policy the agent inherits the environment
# baseline, network_mode = "public", i.e. unrestricted egress. The egress
# sidecar is the only containment layer that binds, because nftables enforces
# it below the agent; the tool-name deny lists are advisory string matchers and
# have all been bypassed in real transcripts. Model API only; this task's agent
# phase needs no other host.
# NB: keep square brackets out of this comment -- validity.sh's route-1 leak
# detector captures the agent section with [^\[]* and a bracket truncates it.
network_mode = "allowlist"
allowed_hosts = [ "api.anthropic.com", "statsig.anthropic.com", "sentry.io", "api.openai.com", "openrouter.ai" ]

[verifier]
timeout_sec = 5700
user = "root"

[verifier.env]
[solution.env]
[environment]
build_timeout_sec = 2700
cpus = 4
memory_mb = 16384
storage_mb = 20480
gpus = 0
network_mode = "public"
workdir = "/hyperfocal/env/workspace"
mcp_servers = []