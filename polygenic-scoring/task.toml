version = "1.0"

[metadata]
source = "hyperfocal"
environment = "sc-svpgsbench"
branch = "main"
problem_id = "from_scratch_svpgs"
difficulty = "medium"
tags = [ "hyperfocal" ]
min_replay_score = 0.80

[agent]
timeout_sec = 86400
user = "agent"
# Agent-phase egress is model-API-only; this task's agent phase needs no other host.
network_mode = "allowlist"
allowed_hosts = [ "api.anthropic.com", "statsig.anthropic.com", "sentry.io", "api.openai.com", "openrouter.ai" ]

[verifier]
network_mode = "no-network"
timeout_sec = 16200
user = "root"

[verifier.env]
[solution.env]
[environment]
build_timeout_sec = 2700
cpus = 4
memory_mb = 16384
storage_mb = 20480
gpus = 0
network_mode = "public"
workdir = "/hyperfocal/env/workspace"
mcp_servers = []

