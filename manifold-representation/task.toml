version = "1.0"

[metadata]
source = "emulated"
environment = "sc-manifold-bench"
branch = "release-M6_full"
problem_id = "M6_full"
difficulty = "hard"
tags = [ "emulated" ]
min_replay_score = 0.9

[agent]
timeout_sec = 86400
user = "agent"
network_mode = "allowlist"
allowed_hosts = [ "api.anthropic.com", "statsig.anthropic.com", "sentry.io", "api.openai.com", "chatgpt.com", "auth.openai.com" ]

[verifier]
timeout_sec = 2700
user = "root"
network_mode = "no-network"

[verifier.env]
[solution.env]
[environment]
# With this commented out, it builds from source by default. For the optional prebuilt image, contact us at founders@emulated.so.
build_timeout_sec = 2700
cpus = 4
memory_mb = 8192
storage_mb = 20480
gpus = 0
network_mode = "public"
workdir = "/hyperfocal/env/workspace"
mcp_servers = []
