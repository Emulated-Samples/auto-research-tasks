# Hyperfocal Environment Configuration
# Configures the env-orchestrator for rollouts and local testing.

version: "1.0"

environment:
  # Must equal the platform environment id: the release pipeline treats the
  # yaml name, ECR repo (emulated-tasks/<id>) and released-tasks org repo as
  # one identity, and builderd refuses to package on a mismatch.
  name: sc-manifold-bench
  description: >
    Design and implement, from scratch, a representation-learning system for
    high-dimensional observations generated by sparse additive combinations of
    reusable latent objects. The agent provides `fit`/`transform` executables in
    workspace/submission/ (SAE / dictionary-learning / manifold-learning /
    end-to-end modeling packages are forbidden). Recover accurate additive
    reconstructions, coherent reusable objects, meaningful presence signals,
    compact low-dimensional contributions, and deterministic efficient inference.

# Paths (relative to paths.root).
paths:
  root: /hyperfocal/env
  environmentDist: environment/dist
  workspace: workspace

# Compute sizing. The public runtime contract and numerical thread budget assume
# exactly 4 vCPU / 8 GiB, which c5.xlarge provides.
#
# Both spellings are needed: instanceType sizes NATIVE EC2 rollouts (an AWS
# venue choice that means nothing off-AWS), while cpus/memoryMb are the
# portable resource REQUIREMENTS the harbor packager writes into task.toml so
# packaged tasks keep the same "four cores, 8 GiB" contract on any runner.
compute:
  cloud: aws
  gpus: 0
  instanceType: c5.xlarge  # 4 vCPU / 8 GiB — matches the promised "four cores, 8 GiB" (native EC2 rollouts)
  cpus: 4                  # portable requirement -> task.toml
  memoryMb: 8192           # portable requirement -> task.toml

# Harbor packaging.
packaging:
  verifierTimeoutSec: 2700
  network:
    verifier:
      mode: no-network
  image:
    env:
      MANIFOLD_BENCH_SANDBOX: external
  sourceBundle: false

agent:
  type: claude-code
  defaultModel: claude-opus-4-8
  # The submission runs offline with no network during fit/transform; the agent
  # itself does not need AWS.
  awsAccess: false
  # Unprivileged agent confined to workspace/; every submitted execution phase
  # is independently isolated under a dedicated account.
  permissionsMode: linux-user
